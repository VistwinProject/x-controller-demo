<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>全區總控 · Zone X</title>

    <!-- iPad「加入主畫面」後全螢幕跑,沒有 Safari 網址欄 / 工具列。
         等同 Chrome/Edge --app 的效果,同一份程式兩邊通用。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="全區總控" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f4f4f5" />
    <!-- 給業主預覽的展示版不希望被搜尋引擎收錄(搭配 public/robots.txt)。
         展場正式部署是內網,這行留著也無妨。 -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/x-controller-demo/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/x-controller-demo/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/x-controller-demo/icon.svg" />
    <script type="module" crossorigin src="/x-controller-demo/assets/index-BCEUp7uz.js"></script>
    <link rel="stylesheet" crossorigin href="/x-controller-demo/assets/index-DQbuEOUf.css">
